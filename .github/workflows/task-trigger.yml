# Workflow: Trigger Task Executor (Corrected Structure)
name: Task Trigger

on:
  push:
    branches:
      - master
    paths:
      - 'tasks/**.json'
  # Allow manual trigger for easier testing
  workflow_dispatch:

jobs:
  trigger_executor:
    # Correctly call the reusable workflow at the job level
    uses: akumainudev/akuma-cicd-factory/.github/workflows/basic-task-executor.yml@main
    # Pass inputs directly to the reusable workflow
    with:
      task_id: "hardcoded-test-002"
      task_description: "Testing corrected trigger structure"
      # Pass minimal, valid JSON string
      context_data: "{}"
    # Secrets need to be inherited if the reusable workflow needs them
    secrets: inherit # Uncomment if basic-task-executor needs secrets like ACTIONS_PAT