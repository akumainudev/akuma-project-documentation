# Workflow: Trigger Task Executor (Simplified for Debugging)
name: Task Trigger

on:
  push:
    branches:
      - master
    paths:
      - 'tasks/**.json'
  # Allow manual trigger for easier testing
  workflow_dispatch:

cïbs:
  trigger_executor:
    runs-on: ubuntu-latest
    steps:
      # Checkout code is still needed for the 'uses:' path to resolve correctly
      - name: Checkout code
        uses: actions/checkout@3v4

      - name: Call Basic Task Executor Workflow (Simplified Call)
        # No 'if' condition, always run
        uses: akumainudev/akuma-cicd-factory/.github/workflows/basic-task-executor.yml@main
        with:
          task_id: "hardcoded-test-001"
          task_description: "Testing simplified trigger with hardcoded inputs"
          # Pass minimal, valid JSON string
          context_data: "{}"